<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>助手小窗 · 隔离布局验收</title>
<style>body{margin:0;background:#e9eef5;display:grid;place-items:center;min-height:100vh;font:13px 'Segoe UI',sans-serif;color:#14213a}main{display:flex;align-items:center;gap:32px}iframe{border:0;box-shadow:0 15px 60px #14213a20;border-radius:18px}aside{max-width:210px}h1{font-size:20px}button{padding:8px 12px;background:white;border:1px solid #c5d2e6;border-radius:8px;cursor:pointer;margin:3px}</style>
<main><iframe id="preview" title="真实助手小窗" src="/quick.html?ui=20261022ui1" width="420" height="520"></iframe><aside><h1>助手小窗</h1><p>实际生产页面，独立工作区和离线模型，不产生费用。</p><button data-size="420,520">默认 420 × 520</button><button data-size="360,360">最小 360 × 360</button><button data-size="500,650">展开 500 × 650</button></aside></main>
<script>document.querySelectorAll('button').forEach(button=>button.onclick=()=>{const [width,height]=button.dataset.size.split(',');const frame=document.getElementById('preview');frame.width=width;frame.height=height;});</script></html>
