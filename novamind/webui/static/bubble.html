<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css?v=20261022ui3"><link rel="stylesheet" href="desktop.css?v=20261022ui3"></head><body class="ball-body"><div id="ball" class="ball" role="button" aria-label="打开 NovaMind" tabindex="0" style="width:48px;height:48px"><img class="mark brand-mark" src="nova-mark.svg" alt=""><span class="task-dot"></span></div><script src="ui_common.js?v=20261024polish1"></script><script src="theme.js?v=20261023chrome1"></script><script>
(()=>{'use strict';const ball=document.getElementById('ball');let origin=null,dragged=false,pending=null,sending=false;
const api=()=>window.pywebview?.api;
async function move(){if(sending||!pending)return;sending=true;const p=pending;pending=null;try{await api()?.drag_ball(p.x,p.y,p.end);}finally{sending=false;if(pending)move();}}
ball.onpointerdown=e=>{if(e.button!==0)return;origin={x:e.screenX,y:e.screenY};dragged=false;ball.setPointerCapture(e.pointerId);};
ball.onpointermove=e=>{if(!origin)return;const x=e.screenX-origin.x,y=e.screenY-origin.y;if(Math.hypot(x,y)>5)dragged=true;if(dragged){pending={x,y,end:false};move();}};
ball.onpointerup=e=>{if(!origin)return;if(dragged){pending={x:e.screenX-origin.x,y:e.screenY-origin.y,end:true};move();}else api()?.show_panel();origin=null;};
ball.onpointercancel=()=>{if(origin){pending={x:0,y:0,end:true};move();}origin=null;};ball.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();api()?.show_panel();}else if(e.key==='ContextMenu'||e.key==='F10'&&e.shiftKey){e.preventDefault();api()?.show_menu();}};ball.oncontextmenu=e=>{e.preventDefault();api()?.show_menu();};
window.addEventListener('novamind-settings',e=>{const d=e.detail.desktop;ball.dataset.motion=String(d.motion);ball.style.setProperty('--ball-accent',{blue:'#527cc8',slate:'#71829a',green:'#449a8c'}[d.accent]);ball.style.width=ball.style.height=d.size+'px';ball.style.opacity=d.opacity;ball.style.transition=d.motion?'':'none';let img=ball.querySelector('img');if(d.icon==='spark'){if(img)img.remove();if(!ball.querySelector('svg'))ball.insertAdjacentHTML('afterbegin',NovaMindUI.icon('spark'));}else{ball.querySelector('svg')?.remove();if(!img){img=document.createElement('img');ball.prepend(img);}img.style.objectFit=d.icon_fit;img.style.borderRadius=d.icon_fit==='cover'?'50%':'0';img.className='mark '+(d.icon==='brand'?'brand-mark':'');img.src=d.icon==='brand'?'nova-mark.svg':'/attachments/images/'+d.icon;}});
async function syncState(){try{const state=await api()?.get_state();if(state){ball.classList.toggle('running',!!state.running&&state.desktop.status);ball.classList.toggle('error',!state.running&&state.desktop.status&&state.result?.state==='error');ball.classList.toggle('completed',!state.running&&state.desktop.status&&state.result?.state==='completed');ball.title=state.running?'NovaMind 正在执行任务，打开可停止':state.result?.message||'打开 NovaMind';ball.setAttribute('aria-label',ball.title);}}catch(_){}}
window.novaMindSyncBubble=syncState;setInterval(()=>{if(!window.novaMindNativeBubble)syncState();},1500);
})();</script><script src="bubble_surface.js?v=20261023polish1"></script></body></html>
