  /* 主题初始化必须先于首帧渲染，避免闪屏 */
  (function () {
    var t = null;
    try { t = localStorage.getItem("novamind-theme"); } catch (e) {}
    if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>

<script>
(function () {
  const messagesEl = document.getElementById('messages');
  const panelEl = document.getElementById('panel');
  const composerFooter = document.querySelector('footer');
  const sessionsEl = document.getElementById('sessions');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('status-text');
  const imageComposer = new NovaMindUI.Images(input, document.querySelector('.composer'));
  document.querySelector('.composer-toolbar').prepend(imageComposer.button);
  const options = document.createElement('details');
  options.className = 'nm-disclosure open-up composer-options';
  options.innerHTML = '<summary>'+NovaMindUI.icon('settings')+'<span id="conversation-options-label">对话选项</span></summary><div class="nm-popover"><h4>当前对话</h4><label>记忆模式<select id="memory-mode" aria-label="记忆模式"><option value="normal">个人记忆</option><option value="no_record">本次不记录</option><option value="private">私密：不读不写</option></select></label><label>项目范围<input id="memory-scope" aria-label="当前项目范围" placeholder="范围：global" value="global"></label><label>表达风格<select id="chat-style" aria-label="本会话表达风格"><option value="">默认表达</option><option value="concise">简洁</option><option value="detailed">详细</option><option value="warm">温和</option><option value="formal">正式</option></select></label></div>';
  document.querySelector('.composer-toolbar').insertBefore(options, document.querySelector('.agent-label'));
  const reasoningHost=document.createElement('span');reasoningHost.className='reasoning-picker';
  document.querySelector('.composer-toolbar').insertBefore(reasoningHost,document.getElementById('stop'));
  const reasoningSelect=NovaMindUI.reasoningPicker(reasoningHost);
  function syncConversationBadge(){
    const value=document.getElementById('memory-mode').value;
    options.classList.toggle('is-private', value!=='normal');
    document.getElementById('conversation-options-label').textContent=value==='private'?'私密对话':value==='no_record'?'本次不记录':'对话选项';
  }
  document.getElementById('memory-mode').addEventListener('change',syncConversationBadge);
  async function desktopCommand(method, ...args) {
    try {
      if(!window.pywebview?.api?.[method]) throw new Error('请在 NovaMind 桌面程序中使用此功能');
      await window.pywebview.api[method](...args);
    } catch(error) { NovaMindControls.notify(error.message); }
    document.querySelector('.desktop-menu').open=false;
  }
  document.getElementById('open-assistant').onclick=()=>desktopCommand('show_panel',currentSession()?.threadId||null);
  document.getElementById('toggle-bubble').onclick=()=>desktopCommand('toggle_bubble');
  document.getElementById('recover-bubble').onclick=()=>desktopCommand('reset_bubble');
  document.getElementById('desktop-settings').onclick=()=>{document.querySelector('.desktop-menu').open=false;document.querySelector('[data-nav="settings"]').click();};

  // ── 白天/黑夜模式切换（翻页式覆盖：新主题色从左侧斜向滑入，慢慢盖住旧界面）──
  const themeBtn = document.getElementById('theme-toggle');
  const wipeEl = document.getElementById('theme-wipe');
  let themeSwitching = false;

  function applyThemeIcon() {
    const light = document.documentElement.dataset.theme === 'light';
    themeBtn.textContent = light ? '☀' : '☾';
    themeBtn.title = light ? '切换黑夜模式' : '切换白天模式';
  }
  applyThemeIcon();
  window.addEventListener('novamind-settings', applyThemeIcon);

  themeBtn.addEventListener('click', () => {
    if (themeSwitching) return;
    themeSwitching = true;
    const html = document.documentElement;
    const next = html.dataset.theme === 'light' ? 'dark' : 'light';

    const finish = () => {
      html.dataset.theme = next;
      try { localStorage.setItem('novamind-theme', next); } catch (e) {}
      applyThemeIcon();
    };

    // 无动画偏好：直接切，不播放覆盖
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
      finish();
      themeSwitching = false;
      return;
    }

    // 覆盖层染上" incoming 主题"的底色（CSS 变量按 next 选择，不改动页面主题）
    html.classList.add(next === 'light' ? 'wipe-light' : 'wipe-dark');
    wipeEl.classList.add('wiping');
    // 双 rAF 确保初始 transform 先渲染，过渡才会生效
    requestAnimationFrame(() => requestAnimationFrame(() => {
      wipeEl.classList.add('covered');
    }));

    // 覆盖完成（页面全被新底色盖住）→ 底层切主题 → 覆盖层淡出露出真实界面
    setTimeout(() => {
      finish();
      wipeEl.classList.add('fading');
      setTimeout(() => {
        wipeEl.classList.remove('wiping', 'covered', 'fading');
        html.classList.remove('wipe-light', 'wipe-dark');
        themeSwitching = false;
      }, 340);
    }, 810);
  });


  // ── Phase 6：按会话隔离状态 ──
  // 每个会话独立持有 {messages, running, abortController, requestToken}，
  // 不再依赖全局 running/currentMessages：A 会话的流只写 A 的状态。
  let sessions = [];            // 侧边栏列表（含未发送的 draft）
  let currentId = null;
  let currentView = 'chat';
  let sessionsLoaded = false;   // 首次加载后才做 last-thread 恢复

  const sessionStates = new Map();
  function sessionState(id) {
    if (!sessionStates.has(id)) {
      sessionStates.set(id, {
        messages: [], running: false, abortController: null, requestToken: 0,
        historyCursor: null, historyHasMore: false, historyLoaded: false,
      });
    }
    return sessionStates.get(id);
  }

  // 各列表的分页游标与 has_more（sessions / history / monitor / skills）
  const pageState = {
    sessions: { cursor: null, hasMore: false },
    monitorSessions: { cursor: null, hasMore: false },
    monitorEvents: { cursor: null, hasMore: false },
    skills: { cursor: null, hasMore: false, count: 0 },
  };
  let requestCounter = 0;

  async function fetchJson(url, options) {
    // 统一错误处理：检查 resp.ok；解析 error.message（兼容 error?.message /
    // message）；非 JSON 错误显示稳定通用文案。
    let resp;
    try {
      resp = await fetch(url, options);
    } catch (e) {
      throw new Error('网络连接失败，请检查后端是否运行');
    }
    const text = await resp.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
    if (!resp.ok) {
      const msg = (data && data.error && data.error.message)
        || (data && data.message)
        || ('请求失败 (HTTP ' + resp.status + ')');
      const err = new Error(msg);
      err.status = resp.status;
      throw err;
    }
    if (data === null) throw new Error('服务端返回了无效数据');
    return data;
  }

  function flashStatus(text) {
    statusText.textContent = text;
    statusEl.className = 'status running';
    setTimeout(refreshRunUI, 3000);
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function renderMarkdown(src) {
    return NovaMindMarkdown.render(src);
  }

  function switchView(view) {
    currentView = view;
    const isChat = view === 'chat';
    composerFooter.hidden = !isChat;
    panelEl.dataset.view = view;
    messagesEl.style.display = isChat ? 'flex' : 'none';
    panelEl.style.display = isChat ? 'none' : view === 'monitor' ? 'flex' : 'block';
    document.querySelectorAll('.nav-item').forEach(n => {
      n.classList.toggle('active', n.dataset.nav === view);
    });
    if (view === 'monitor') loadMonitor();
    else if (view === 'settings' || view === 'schedule') window.NovaMindPersonal.render(view);
    else if (view === 'doctor') loadDoctor();
    else if (view === 'skills') loadSkills();
    else if (view === 'memory') loadMemories();
    else { refreshRunUI(); input.focus(); }
  }

  async function loadSessions(reset = true) {
    if (reset) {
      pageState.sessions.cursor = null;
      pageState.sessions.hasMore = false;
    }
    try {
      let url = '/sessions?limit=100';
      if (pageState.sessions.cursor) url += '&cursor=' + encodeURIComponent(pageState.sessions.cursor);
      const data = await fetchJson(url);
      const items = (data.sessions || []).map(s => ({
        id: s.thread_id, threadId: s.thread_id, title: s.title, isDraft: false,
      }));
      pageState.sessions.cursor = (data.pagination && data.pagination.next_cursor) || null;
      pageState.sessions.hasMore = !!(data.pagination && data.pagination.has_more);
      if (reset) {
        // Drafts and in-flight mirrored turns may not be persisted yet.
        const drafts = sessions.filter(x => x.isDraft || sessionStates.get(x.id)?.running);
        const known = new Set(items.map(x => x.id));
        sessions = drafts.filter(x => !known.has(x.id)).concat(items);
        const last = localStorage.getItem('novamind_last_thread');
        const quickThread = new URLSearchParams(location.search).get('thread');
        if (!sessionsLoaded && quickThread) {
          // A3：Quick Panel 升级到完整 Agent 时带 thread 参数，直接续接同一会话
          await switchTo(quickThread);
          history.replaceState({}, '', location.pathname);
        } else if (!sessionsLoaded && last && sessions.some(s => s.id === last)) await switchTo(last);
        else if (!sessionsLoaded) newChat();
        sessionsLoaded = true;
      } else {
        const known = new Set(sessions.map(x => x.id));
        items.forEach(it => { if (!known.has(it.id)) sessions.push(it); });
      }
    } catch (e) {
      if (reset) sessions = sessions.filter(x => x.isDraft);
      if (!sessionsLoaded) { sessionsLoaded = true; newChat(); }
    }
    renderSessions();
  }

  function currentSession() { return sessions.find(s => s.id === currentId); }
  function newChat() {
    stashComposer();
    switchView('chat');
    const draft = { id: 'draft_' + Date.now(), threadId: null, title: '新会话', isDraft: true };
    sessions.unshift(draft);
    currentId = draft.id;
    restoreComposer();
    renderSessions();
    renderMessages();
    refreshRunUI();
    input.focus();
  }
  async function switchTo(id) {
    stashComposer();
    switchView('chat');
    currentId = id;
    restoreComposer();
    const s = currentSession();
    if (!s) return;
    const st = sessionState(id);
    if (!s.isDraft && !st.historyLoaded) {
      try {
        const data = await fetchJson('/history/' + encodeURIComponent(s.threadId) + '?limit=100');
        st.messages = data.messages || [];
        st.historyCursor = (data.pagination && data.pagination.next_cursor) || null;
        st.historyHasMore = !!(data.pagination && data.pagination.has_more);
        st.historyLoaded = true;
      } catch (e) { st.messages = []; }
    }
    localStorage.setItem('novamind_last_thread', s.isDraft ? '' : s.threadId);
    renderSessions();
    renderMessages();
    refreshRunUI();
    input.focus();

  async function deleteSession(id, e) {
    e.stopPropagation();
    const s = sessions.find(x => x.id === id);
    if (s && !s.isDraft) {
      const st = sessionStates.get(id);
      // 删除运行中的会话：先 abort 本轮（服务端取消并回滚），再调 DELETE
      if (st && st.running && st.abortController) st.abortController.abort();
      try {
        const data = await fetchJson('/sessions/' + encodeURIComponent(s.threadId), { method: 'DELETE' });
        if (!data || data.status !== 'ok') throw new Error('服务端未确认删除');
      } catch (err) {
        flashStatus('删除失败：' + err.message);
        return;  // 删除失败（含遗留 200 error）不做乐观移除，会话保留
      }
    }
    sessionStates.delete(id);
    sessions = sessions.filter(x => x.id !== id);
    if (currentId === id) {
      if (sessions.length) await switchTo(sessions[0].id);
      else newChat();
    } else renderSessions();
  }

  async function send() {
    const learningStarted = Date.now();
    const text = input.value.trim();
    if ((!text && !imageComposer.items.length) || !currentId || imageComposer.pending) return;
    if(imageComposer.items.length>3){flashStatus('草稿图片均已保留，请移除至最多 3 张后发送');return;}
    const s = currentSession();
    if (!s) return;
    const st = sessionState(currentId);
    if (st.running) return;

    let sessionId = currentId;          // 固定本次发送的会话
    const token = ++requestCounter;     // 请求 token：晚到的旧帧按 token 丢弃
    st.requestToken = token;
    st.running = true;
    st.lastMemories = [];
    st.lastSchedules = [];
    st.abortController = new AbortController();

    input.value = '';
    input.style.height = 'auto';
    const images = imageComposer.clear();
    const requestOptions = {memory_mode:document.getElementById('memory-mode').value,
      scope:document.getElementById('memory-scope').value || 'global',style:document.getElementById('chat-style').value,
      reasoning:reasoningSelect.value,client_id:NovaMindUI.clientId,source:'workspace'};
    st.messages.push({ role: 'user', content: text, tools: [], images });

    const isViewing = () => sessionId === currentId && currentView === 'chat';
    if (isViewing()) { renderMessages(); refreshRunUI(); }

    // AI 气泡：仅当用户仍停留在该会话时挂到 DOM
    const aiEl = document.createElement('div');
    aiEl.className = 'msg ai';
    const aiBody = document.createElement('div');
    aiBody.className = 'markdown-body';
    aiEl.appendChild(aiBody);
    const cursorEl = document.createElement('span');
    cursorEl.className = 'cursor';
    aiEl.appendChild(cursorEl);
    let attached = false;
    const ensureAttached = () => {
      if (!attached && isViewing()) {
        messagesEl.appendChild(aiEl);
        attached = true;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      return attached;
    };
    ensureAttached();

    const turn = NovaMindChatLogic.createTurnState();
    let aborted = false;

    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, images, thread_id: s.threadId, ...requestOptions }),
        signal: st.abortController.signal,
      });
      if (!resp.ok || !resp.body) {
        let msg = 'HTTP ' + resp.status;
        try {
          const d = await resp.json();
          msg = (d && d.error && d.error.message) || d.message || msg;
        } catch (e2) {}
        throw new Error(msg);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) !== -1) {
          const frame = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          const line = frame.split('\n').find(l => l.startsWith('data: '));
          if (!line) continue;
          let data;
          try { data = JSON.parse(line.slice(6)); } catch (e3) { continue; }
          // 晚到帧：token 不匹配则只丢弃，不写进当前切换后的会话
          if (st.requestToken !== token) continue;
          if (data.type === 'memories') { st.lastMemories = data.items; continue; }
          if (data.type === 'schedules') { st.lastSchedules = data.items; continue; }
          if (data.type === 'thread') {
            if (s.isDraft) {
              s.threadId = data.thread_id;
              s.isDraft = false;
              s.id = data.thread_id;
              sessionStates.set(data.thread_id, st);   // 状态迁移到真实 thread
              sessionStates.delete(sessionId);
              if (currentId === sessionId) currentId = data.thread_id;
              sessionId = data.thread_id;
              localStorage.setItem('novamind_last_thread', data.thread_id);
            }
          } else {
            // 状态统一走纯 helper（含 errorText 稳定文案），DOM 按类型更新
            const changed = NovaMindChatLogic.applyFrame(turn, data);
            if (!changed) continue;
            if (data.type === 'tool') {
              if (ensureAttached()) {
                const tag = document.createElement('span');
                tag.className = 'tool-tag';
                tag.textContent = '⚙ ' + data.name;
                aiEl.insertBefore(tag, aiBody);
                messagesEl.scrollTop = messagesEl.scrollHeight;
              }
            } else if (data.type === 'text') {
              if (ensureAttached()) {
                aiBody.innerHTML = renderMarkdown(turn.chunks.join(''));
                messagesEl.scrollTop = messagesEl.scrollHeight;
              }
            } else if (data.type === 'limit') {
              if (ensureAttached()) {
                const seg = document.createElement('span');
                seg.innerHTML = '<b>⚠ 达到最大循环次数</b>';
                aiEl.insertBefore(seg, aiBody);
              }
            } else if (data.type === 'error') {
              if (ensureAttached()) {
                const seg = document.createElement('span');
                seg.textContent = turn.errorText;
                aiEl.insertBefore(seg, aiBody);
              }
            }
          }
        }
      }
    } catch (err) {
      aborted = err.name === 'AbortError';
      const visible=sessionId===currentId,draft=st.draft||{};
      const newer=visible?input.value:(draft.text||''),retained=visible?imageComposer.items:(draft.images||[]);
      for(const id of [...images].reverse())if(!retained.includes(id))retained.unshift(id);
      draft.text=newer&&newer!==text?text+'\n\n'+newer:text;draft.images=retained;st.draft=draft;
      if(visible){input.value=draft.text;imageComposer.restore(retained);}
      NovaMindChatLogic.setTerminalError(turn, aborted, err.message);
      const seg = document.createElement('span');
      seg.textContent = turn.errorText;
      if (ensureAttached()) aiEl.insertBefore(seg, aiBody);
    } finally {
      cursorEl.remove();
      if (turn.chunks.length) addCopyBtn(aiEl, () => turn.chunks.join(''));
      st.running = false;
      st.abortController = null;
      const finalMsg = NovaMindChatLogic.buildFinalMessage(turn);
      if (finalMsg) {
        finalMsg.memories = st.lastMemories || [];
        finalMsg.schedules = st.lastSchedules || [];
        // 终态（含停止/错误提示）写入会话状态：切换/重绘后仍然可见
        st.messages.push(finalMsg);
      }
      if (sessionId === currentId) { renderMessages(); refreshRunUI();
        if(requestOptions.memory_mode==='normal'&&!turn.errorText){const last=[...messagesEl.querySelectorAll('.msg.ai')].pop();window.NovaMindLearning?.usage(sessionId,last,learningStarted);}
      }
      renderSessions();
      if (!s.isDraft) loadSessions(true);  // 刷新侧边栏标题（不重新选择会话）
      input.focus();
    }
  }

  let monitorEventsCache = [];
  let monitorEventsFetching = false;
  let monitorEventsToken = 0;
  const MONITOR_CACHE_LIMIT = 2000;

  async function fetchEvents(threadId, cursor) {
    // 收尾修复 Phase 3：有界尾页（limit=200）+ tail-follow 增量拉取。
    // 捕获请求 token：切换会话后旧响应直接丢弃，不追加进新会话缓存。
    const token = ++monitorEventsToken;
    try {
      let url = '/monitor/events/' + encodeURIComponent(threadId) + '?limit=200';
      if (cursor) url += '&cursor=' + encodeURIComponent(cursor);
      const data = await fetchJson(url);
      if (token !== monitorEventsToken || threadId !== monitorActiveId) {
        return null;  // 已切换会话：丢弃旧响应
      }
      const pag = data.pagination || {};
      return {
        events: data.events || [],
        nextCursor: pag.next_cursor || null,
        hasMore: !!pag.has_more,
      };
    } catch (e) {
      if (e.status === 400) {
        // 文件截断/轮转：清空旧游标，下一次请求刷新第一页
        pageState.monitorEvents.cursor = null;
        pageState.monitorEvents.hasMore = false;
        monitorEventsCache = [];
      }
      return null;
    }
  }
  function eventLabel(ev) {
    const map = {
      llm_input: 'NEURON', context_pack_loaded: 'CONTEXT', policy_check: 'POLICY',
      policy_violation: 'BLOCK', tool_call: 'TOOL', tool_result: 'RESULT',
      token_usage: 'TOKEN', ai_message: 'REPLY', system_action: 'SYS',
    };
    return map[ev] || ev;
  }
  function eventDetail(e) {
    switch (e.event) {
      case 'tool_call': return (e.tool || '') + ' ' + (e.args ? JSON.stringify(e.args).slice(0, 80) : '');
      case 'tool_result': return (e.tool || '') + ' → ' + (e.result_summary || '').slice(0, 80);
      case 'token_usage': return 'in=' + (e.prompt_tokens || 0) + ' out=' + (e.completion_tokens || 0) + ' total=' + (e.total_tokens || 0);
      case 'ai_message': return (e.content || '').slice(0, 100);
      case 'policy_violation': return (e.tool || '') + '：' + (e.reason || '');
      case 'policy_check': return (e.tool || '') + ' allowed=' + (e.allowed ? 'Y' : 'N');
      case 'llm_input': return (e.message_count || 0) + ' msgs';
      case 'system_action': return e.content || '';
      case 'context_pack_loaded': return e.pack || '';
      default: return '';
    }
  }
  function tsShort(ts) {
    if (!ts) return '';
    // 审计日志 ts 为 UTC（带 Z 后缀），需转本地时区显示，否则比本地时间慢 8 小时
    const d = new Date(ts);
    if (isNaN(d.getTime())) return String(ts).replace('T', ' ').slice(0, 19);
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  async function renderMonitor(resetEvents = true) {
    const sessionScroll = panelEl.querySelector('.monitor-sessions')?.scrollTop || 0;
    const eventScroll = resetEvents ? 0 : panelEl.querySelector('.monitor-events')?.scrollTop || 0;
    let msHtml = monitorSessions.map(s =>
      '<div class="ms-item' + (s.thread_id === monitorActiveId ? ' active' : '') + '" data-tid="' + escapeHtml(s.thread_id) + '">' +
      escapeHtml(s.thread_id) + '<div class="ms-size">' + (s.size_bytes / 1024).toFixed(1) + ' KB</div></div>'
    ).join('');
    if (pageState.monitorSessions.hasMore) {
      msHtml += '<div class="load-more" id="monitor-load-more">加载更多…</div>';
    }

    if (resetEvents) {
      // 切换会话：重置缓存与游标，请求最新尾页
      monitorEventsCache = [];
      pageState.monitorEvents.cursor = null;
      pageState.monitorEvents.hasMore = false;
      const page = await fetchEvents(monitorActiveId, null);
      if (page) {
        monitorEventsCache = page.events;
        pageState.monitorEvents.cursor = page.nextCursor;
        pageState.monitorEvents.hasMore = page.hasMore;
      }
    } else if (!monitorEventsFetching) {
      // 增量：防重入（同一监控页同时只允许一次增量请求）
      monitorEventsFetching = true;
      try {
        const page = await fetchEvents(monitorActiveId, pageState.monitorEvents.cursor);
        if (page) {
          // 空增量页只更新 cursor，不清空已有事件
          monitorEventsCache = monitorEventsCache.concat(page.events);
          pageState.monitorEvents.cursor = page.nextCursor;
          pageState.monitorEvents.hasMore = page.hasMore;
          if (monitorEventsCache.length > MONITOR_CACHE_LIMIT) {
            // 长时间查看：浏览器缓存保留最新 2000 条
            monitorEventsCache = monitorEventsCache.slice(-MONITOR_CACHE_LIMIT);
          }
        }
      } finally {
        monitorEventsFetching = false;
      }
    }
    const events = monitorEventsCache;
    let evHtml = '';
    if (!events.length) {
      evHtml = '<div class="panel-empty">该会话暂无事件。</div>';
    } else {
      events.forEach(e => {
        evHtml += '<div class="event ' + escapeHtml(e.event || '') + '">' +
          '<span class="event-ts">' + escapeHtml(tsShort(e.ts)) + '</span>' +
          '<span class="event-type">' + eventLabel(e.event) + '</span>' +
          '<span class="event-detail">' + escapeHtml(eventDetail(e)) + '</span></div>';
      });
    }
    // EOF 也保留更新入口（has_more=false 显示"检查更新"，可继续 tail-follow）
    evHtml += '<div class="load-more" id="events-load-more">' +
      (pageState.monitorEvents.hasMore ? '继续加载…' : '检查更新') + '</div>';

    panelEl.innerHTML = '<div class="panel-header"><span class="bar">❯</span> 监控面板 <span class="count">' + monitorSessions.length + ' LOGS</span></div>' +
      '<div class="panel-sub">AUDIT EVENT STREAM · LIVE</div>' +
      '<div class="monitor-layout">' +
      '<div class="monitor-sessions" tabindex="0" role="region" aria-label="审计会话列表"><div class="ms-title">Sessions</div>' + msHtml + '</div>' +
      '<div class="monitor-events" tabindex="0" role="region" aria-label="当前会话审计事件">' + evHtml + '</div></div>';

    panelEl.querySelector('.monitor-sessions').scrollTop = sessionScroll;
    panelEl.querySelector('.monitor-events').scrollTop = eventScroll;

    panelEl.querySelectorAll('.ms-item').forEach(item => {
      item.addEventListener('click', async () => {
        monitorActiveId = item.dataset.tid;
        await renderMonitor();
      });
    });
    const more = panelEl.querySelector('#monitor-load-more');
    if (more) more.addEventListener('click', () => loadMonitor(false));
    const evMore = panelEl.querySelector('#events-load-more');
    if (evMore) evMore.addEventListener('click', () => renderMonitor(false));
  }

  let skillsCache = [];
  let skillsRequest = 0;
  let skillsRevision = 0;
  const skillSaves = new Set();
  let skillNotice = '';
  async function loadSkills(reset = true) {
    const token = ++skillsRequest;
    const revision = skillsRevision;
    if (reset) {
      pageState.skills.cursor = null;
      pageState.skills.hasMore = false;
      skillsCache = [];
    }
    panelEl.innerHTML = '<div class="panel-loading">正在加载技能库...</div>';
    try {
      let url = '/skills?limit=100';
      if (pageState.skills.cursor) url += '&cursor=' + encodeURIComponent(pageState.skills.cursor);
      const data = await fetchJson(url);
      if (token !== skillsRequest || currentView !== 'skills') return;
      if (revision !== skillsRevision) return loadSkills(reset);
      const items = data.skills || [];
      skillsCache = reset ? items : skillsCache.concat(items);
      pageState.skills.cursor = (data.pagination && data.pagination.next_cursor) || null;
      pageState.skills.hasMore = !!(data.pagination && data.pagination.has_more);
      pageState.skills.count = data.count || 0;
      renderSkills({ skills: skillsCache, count: pageState.skills.count });
    } catch (e) {
      if (token !== skillsRequest || currentView !== 'skills') return;
      panelEl.innerHTML = '<div class="panel-error">加载技能失败：' + escapeHtml(e.message) + '</div>';
    }
  }
  async function saveSkillEnabled(skillId) {
    const skill = skillsCache.find(s => s.skill_id === skillId);
    if (!skill || skillSaves.has(skillId)) return;
    const enabled = !skill.enabled;
    skillSaves.add(skillId);
    skillNotice = '';
    renderSkills({ skills: skillsCache, count: pageState.skills.count });
    try {
      const result = await fetchJson('/skills/' + encodeURIComponent(skillId), {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled }),
      });
      if (result.skill_id !== skillId || typeof result.enabled !== 'boolean') {
        throw new Error('状态响应异常，请刷新技能页确认');
      }
      skillsRevision++;
      skillsCache.forEach(s => { if (s.skill_id === skillId) s.enabled = result.enabled; });
      skillNotice = skill.name + (result.enabled ? ' 已启用' : ' 已关闭');
    } catch (e) {
      skillNotice = '保存失败：' + e.message + '。若连接中断，请重新进入技能页确认状态。';
    } finally {
      skillSaves.delete(skillId);
      if (currentView === 'skills') {
        renderSkills({ skills: skillsCache, count: pageState.skills.count });
        const button = Array.from(panelEl.querySelectorAll('.skill-toggle'))
          .find(el => el.dataset.skillId === skillId);
        if (button) button.focus({ preventScroll: true });
      }
    }
  }
  function renderSkills(data) {
    const attr = value => escapeHtml(value).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const skills = data.skills || [];
    if (data.error) {
      panelEl.innerHTML = '<div class="panel-header"><span class="bar">❯</span> 技能管理</div><div class="panel-error">' + escapeHtml(data.error) + '</div>';

    html += '<div class="panel-sub">启用的技能可由 Agent 按需加载；关闭不会删除文件，也不会中断正在执行的任务。</div>';
    html += '<div class="skill-notice" role="status" aria-live="polite">' + escapeHtml(skillNotice) + '</div>';
    if (!skills.length) {
      html += '<div class="panel-empty">暂无技能。</div>';
    } else {
      html += '<div class="skill-grid">';
      skills.forEach(s => {
        html += '<div class="skill-card">';
        html += '<div class="skill-name">' + escapeHtml(s.name) + '</div>';
        html += '<div class="skill-desc">' + escapeHtml(NovaMindSkillDescriptions.describe(s.description)) + '</div>';
        html += '<div class="skill-meta">';

        if (s.selections > 0) html += '<span class="rate">有效率 ' + (s.effective_rate * 100).toFixed(0) + '%</span>';
        html += '</div><div class="skill-controls"><span class="skill-state">'
          + (skillSaves.has(s.skill_id) ? '正在保存…' : s.enabled ? '已启用' : '已关闭') + '</span>';
        html += '<button type="button" class="skill-toggle" role="switch" aria-checked="'
          + (s.enabled ? 'true' : 'false') + '" aria-label="' + attr(s.name) + ' 技能开关"'

      html += '</div>';

    if (pageState.skills.hasMore) {
      html += '<div class="load-more" id="skills-load-more">加载更多…</div>';

    panelEl.innerHTML = html;
    panelEl.querySelectorAll('.skill-toggle').forEach(button => {

  // ── 记忆中心（B1/B2）─────────────────────────────────────────────────
  let memoryDocumentScope='global';
  let memoryDocumentRequest=0;
  async function mountMemoryDocument(){
    const editor=document.getElementById('memory-document-text'),save=document.getElementById('memory-document-save');
    if(!editor)return;
    const state=document.getElementById('memory-document-state'),scopeInput=document.getElementById('memory-document-scope');
    const compare=document.getElementById('memory-document-compare'),server=document.getElementById('memory-document-server');
    const scope=memoryDocumentScope,request=++memoryDocumentRequest;
    const current=()=>editor.isConnected&&request===memoryDocumentRequest&&scope===memoryDocumentScope;
    const dirty=()=>editor.dataset.loaded==='true'&&editor.value!==editor.dataset.original;
    const discard=async()=>!dirty()||!!await NovaMindUI.dialogForm({title:'放弃尚未保存的记忆编辑？',
      description:'重新加载或切换范围会替换当前草稿。请先复制需要保留的内容。',submit:'继续加载'});
    save.disabled=true;editor.disabled=true;compare.hidden=true;
    document.getElementById('memory-document-reload').onclick=async()=>{if(await discard())await mountMemoryDocument();};
    scopeInput.onchange=async event=>{
      const next=event.target.value.trim()||'global';
      if(next===scope)return;
      if(!await discard()){event.target.value=scope;return;}
      memoryDocumentScope=next;await mountMemoryDocument();
    };
    save.onclick=async()=>{
      if(!current()||save.disabled)return;
      if(editor.dataset.conflict==='true'&&!await NovaMindUI.dialogForm({title:'以当前文本保存记忆？',
        description:'请确认已对照并合并双方内容。保存后，未出现在文本中的当前范围条目将被停用。',submit:'确认合并并保存'}))return;
      if(!current())return;
      const payload={content:editor.value,revision:editor.dataset.revision,scope};
      save.disabled=true;editor.disabled=true;scopeInput.disabled=true;state.textContent='正在保存…';
      try{
        await fetchJson('/personal/memory-document',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        if(current())await loadMemories();
      }catch(error){
        if(current()){state.textContent=error.message+'；草稿已保留。若版本已更新，请复制草稿后重新加载并合并。';save.disabled=false;}
      }finally{if(current())editor.disabled=false;if(scopeInput.isConnected)scopeInput.disabled=false;}
    };
    try{
      const doc=await fetchJson('/personal/memory-document?scope='+encodeURIComponent(scope));
      if(!current())return;
      editor.value=doc.content;editor.dataset.original=doc.content;editor.dataset.loaded='true';
      editor.dataset.revision=doc.revision;editor.dataset.conflict=String(!!doc.conflict);
      editor.disabled=false;save.disabled=false;server.readOnly=true;server.value=doc.server_content||'';
      compare.hidden=!doc.conflict;document.getElementById('memory-document-path').textContent=doc.path;
      state.textContent=doc.conflict?'双方均有修改：上方为可编辑的文件内容，展开下方已保存内容进行合并。保存不会自动合并。'
        :'已确认内容会在发送前注入上下文，受当前范围、隐私模式和记忆预算约束。';
    }catch(error){if(current())state.textContent=error.message;}
  }
  let memoryCache = [];
  let memoryRequest = 0, memoryOffset = 0;
  let memoryFilters = {state:'',category:''};
  const memoryStateLabels = {
    proposed: '候选', active: '生效', disabled: '已禁用',
    rejected: '已拒绝', deleted: '已删除',
  };
  const memoryCategoryLabels = {
    preference: '偏好', project_context: '项目上下文',
    experience: '经验', active_task: '临时任务', general: '通用', legacy: '历史',
  };

  async function loadMemories(more = false) {
    more = more === true;
    const token=++memoryRequest;
    const state = document.getElementById('memory-state-filter')?.value ?? memoryFilters.state;
    const category = document.getElementById('memory-category-filter')?.value ?? memoryFilters.category;
    memoryFilters={state,category};
    if(!more)memoryOffset=0;
    panelEl.innerHTML = '<div class="panel-loading">正在加载记忆中心...</div>';
    try {
      let url = '/memories?limit=100&offset='+memoryOffset;
      if (state !== 'deleted') url += '&exclude_deleted=true';
      if (state) url += '&state=' + encodeURIComponent(state);
      if (category) url += '&category=' + encodeURIComponent(category);
      const [data, settings] = await Promise.all([
        fetchJson(url), fetchJson('/settings/memory'),
      ]);
      if(token!==memoryRequest||currentView!=='memory')return;
      memoryCache = more ? memoryCache.concat(data.memories||[]) : data.memories || [];
      memoryOffset += (data.memories||[]).length;
      renderMemories({...data,memories:memoryCache}, settings);
    } catch (e) {
      if(token!==memoryRequest||currentView!=='memory')return;
      panelEl.innerHTML = '<div class="panel-error">加载记忆失败：' + escapeHtml(e.message) + '</div>';
    }
  }

    html += '<section class="memory-document"><div class="memory-document-heading"><div><span class="control-label">PERSONAL CONTEXT</span><h3>MEMORY.md</h3></div><label>范围 <input id="memory-document-scope" aria-label="记忆文本范围" maxlength="120" value="'+attr(memoryDocumentScope)+'"></label></div><p>把重要事实整理成一份可编辑的文本。每条用空行分隔；移除的条目会停用，候选不会自动混入。</p><textarea id="memory-document-text" aria-label="个人记忆文本" spellcheck="false" disabled placeholder="正在加载记忆文本…"></textarea><details id="memory-document-compare" hidden><summary>当前已保存内容 · 展开对照</summary><p>此处为治理库中当前有效的文本，只读供比较。请在上方手工合并，不会自动覆盖草稿。</p><textarea id="memory-document-server" aria-label="当前已保存的记忆文本（只读）" readonly spellcheck="false"></textarea></details><div class="memory-document-footer"><span id="memory-document-state" role="status"></span><button id="memory-document-reload">重新加载</button><button id="memory-document-save" class="primary" disabled>保存记忆</button></div><small id="memory-document-path"></small></section>';

    } else {

        html += '<div class="memory-content">' + escapeHtml(m.content || (state === 'deleted' ? '此记忆已删除，不再参与回答。' : '（正文缺失）')) + '</div>';

        recall_enabled: document.getElementById('memory-recall').checked,
        auto_extract: document.getElementById('memory-auto-extract').checked,
        token_budget: Number(document.getElementById('memory-budget').value || 2000),

        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      NovaMindControls.notify('保存记忆设置失败：' + e.message);

  async function handleMemoryAction(button) {
    const card = button.closest('.memory-card');
    const memoryId = card.dataset.memoryId;
    const revision = Number(card.dataset.revision);
    const action = button.dataset.memoryAction;
    try {
      if (action === 'edit' || action === 'detail') {
        const detail = await fetchJson('/memories/' + encodeURIComponent(memoryId));
        const box = card.querySelector('.memory-detail');
        card.querySelector('.memory-edit-text').value = detail.content || '';
        card.querySelector('.memory-revisions').innerHTML = (detail.revisions || [])
          .slice(-5).map(r => '<div>rev ' + r.revision + ' · '
            + escapeHtml(r.to_state) + (r.reason ? ' · ' + escapeHtml(r.reason) : '')
            + '</div>').join('');
        box.hidden = false;
        return;
      }
      if (action === 'cancel') {
        card.querySelector('.memory-detail').hidden = true;
        return;
      }
      if (action === 'save') {
        const content = card.querySelector('.memory-edit-text').value;
        const category = card.querySelector('.memory-edit-category').value;
        const scope = card.querySelector('.memory-edit-scope').value.trim() || 'global';
        await fetchJson('/memories/' + encodeURIComponent(memoryId), {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content, category, scope, revision }),
        });
        await loadMemories();
        return;
      }
      if(action==='purge'){
        if(!await NovaMindUI.dialogForm({title:'清除这条记忆的正文？',description:'清理记忆正文、索引及本应用可控旧画像备份中的该段内容。普通聊天历史不会删除。',submit:'清除正文',danger:true}))return;
        await fetchJson('/personal/memories/'+encodeURIComponent(memoryId)+'/purge',{method:'POST'});
        await loadMemories();return;
      }
      if (action === 'delete') {
        if(!await NovaMindUI.dialogForm({title:'删除这条记忆？',description:'停止使用并阻止后台抽取恢复这条记忆。',submit:'删除记忆',danger:true}))return;
        await fetchJson('/memories/' + encodeURIComponent(memoryId), { method: 'DELETE' });
      } else {
        await fetchJson('/memories/' + encodeURIComponent(memoryId) + '/' + action, {
          method: 'POST',
        });
      }
      await loadMemories();
    } catch (e) {
      NovaMindControls.notify('操作失败：' + e.message);
    }
  }

  const mirroredTurns=new Map();
  function paintMirrored(id){if(id===currentId&&currentView==='chat'){renderMessages();refreshRunUI();}renderSessions();}
  async function reloadMirrored(id){const st=sessionState(id);if(st.running)return;try{const data=await fetchJson('/history/'+encodeURIComponent(id)+'?limit=100');if(st.running)return;st.messages=(data.messages||[]).concat(st.messages.filter(m=>m.unpersisted));st.historyLoaded=true;st.historyCursor=data.pagination?.next_cursor||null;st.historyHasMore=!!data.pagination?.has_more;paintMirrored(id);}catch(error){flashStatus(error.message);}}
  function connectConversations(){NovaMindUI.liveConversations(event=>{
    if(event.kind==='snapshot'){for(const [turnId,entry] of mirroredTurns)if(!event.turns.includes(turnId)){entry.st.running=false;entry.st.remoteTurn=null;entry.ai.live=false;mirroredTurns.delete(turnId);flashStatus('同步已结束；本轮结束状态未确认，正在核对历史');reloadMirrored(entry.id);}return;}
    if(event.kind==='history'){loadSessions(true).then(()=>{if(currentId===event.thread_id)reloadMirrored(event.thread_id);});return;}
    const id=event.thread_id;
    if(event.kind==='start'){
      if(mirroredTurns.has(event.turn_id)&&!event.frames)return;
      const st=sessionState(id);if(st.running&&!st.remoteTurn)return;
      const needsHistory=!st.historyLoaded;
      st.messages=st.messages.filter(m=>m.liveTurn!==event.turn_id&&!m.unpersisted);
      let session=sessions.find(s=>s.threadId===id);if(!session){session={id,threadId:id,title:event.message?.slice(0,24)||'图片对话',isDraft:false};sessions.unshift(session);}
      const user={role:'user',content:event.message||'',images:event.images||[],tools:[],liveTurn:event.turn_id};
      const ai={role:'ai',content:'',tools:[],memories:[],schedules:[],live:true,liveTurn:event.turn_id,syncTruncated:!!event.truncated,note:event.truncated?'同步内容不完整，较早内容已省略。完成后会从历史校正。':''};
      st.messages.push(user,ai);st.running=true;st.remoteTurn=event.turn_id;st.historyLoaded=true;mirroredTurns.set(event.turn_id,{id,st,ai});
      if(needsHistory)fetchJson('/history/'+encodeURIComponent(id)+'?limit=100').then(data=>{if(st.running&&st.remoteTurn===event.turn_id){st.messages=(data.messages||[]).concat(st.messages.filter(m=>m.liveTurn===event.turn_id));st.historyCursor=data.pagination?.next_cursor||null;st.historyHasMore=!!data.pagination?.has_more;paintMirrored(id);}}).catch(()=>{});
      if(currentView==='chat'&&currentId!==id&&(!currentId||!sessionState(currentId).messages.length)&&!input.value.trim()&&!imageComposer.items.length)switchTo(id);
      paintMirrored(id);
    }else if(event.kind==='frame'){
      const entry=mirroredTurns.get(event.turn_id);if(!entry)return;const frame=event.frame;
      if(frame.type==='text')entry.ai.content+=frame.content;
      if(frame.type==='tool')entry.ai.tools.push(frame.name);
      if(frame.type==='memories')entry.ai.memories=frame.items||[];
      if(frame.type==='schedules')entry.ai.schedules=frame.items||[];
      if(frame.type==='error'){entry.ai.syncError=frame.message||'回答未能完成，请重试';entry.ai.note=[entry.ai.syncError,entry.ai.syncTruncated?'同步内容不完整，较早内容已省略。':''].filter(Boolean).join(' · ');}
      paintMirrored(id);
    }else if(event.kind==='finish'){
      const entry=mirroredTurns.get(event.turn_id);if(!entry)return;entry.st.running=false;entry.st.remoteTurn=null;entry.ai.live=false;const failed=!!event.error||!!entry.ai.syncError;entry.ai.note=[entry.ai.syncError||(failed?'回答未能完成，请重试':event.cancelled?'已停止':''),entry.ai.syncTruncated?'同步内容不完整，较早内容已省略。':''].filter(Boolean).join(' · ');if(event.cancelled||failed)entry.st.messages.filter(m=>m.liveTurn===event.turn_id).forEach(m=>m.unpersisted=true);mirroredTurns.delete(event.turn_id);paintMirrored(id);loadSessions(true);if(!event.cancelled&&!failed)reloadMirrored(id);
    }
  });}
  loadSessions().finally(() => {
    const view=new URLSearchParams(location.search).get('view');
    if(['settings','schedule'].includes(view))switchView(view);
    connectConversations();
  });
})();
