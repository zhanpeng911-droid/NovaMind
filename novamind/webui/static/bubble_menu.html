<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css?v=20261022ui3"><link rel="stylesheet" href="desktop.css?v=20261022ui3"></head><body><div class="desktop-card launch-card"><header class="desktop-head"><img class="brand-mark" src="nova-mark.svg" alt=""><strong>NovaMind</strong><button class="push" id="close" aria-label="收起">×</button></header><div class="launch-content"><button class="launch-main" data-action="chat"><span data-icon="chat"></span>问 NovaMind<span style="margin-left:auto">↗</span></button><div class="launch-grid"><button data-action="translate"><span data-icon="translate"></span>翻译</button><button data-action="explain"><span data-icon="book"></span>解释</button><button data-action="summarize"><span data-icon="summary"></span>总结</button><button data-action="record"><span data-icon="calendar"></span>记录</button></div><div class="launch-bottom"><button id="workspace"><span data-icon="window"></span>完整工作台</button><button id="settings"><span data-icon="settings"></span>设置</button></div></div></div><script src="ui_common.js?v=20261024polish1"></script><script src="theme.js?v=20261023chrome1"></script><script>
(()=>{const api=()=>window.pywebview?.api;document.querySelectorAll('[data-icon]').forEach(n=>n.innerHTML=NovaMindUI.icon(n.dataset.icon));document.querySelectorAll('[data-action]').forEach(n=>n.onclick=()=>api()?.choose_action(n.dataset.action));document.getElementById('close').onclick=()=>api()?.hide_menu();document.getElementById('workspace').onclick=()=>{api()?.hide_menu();api()?.open_workspace();};document.getElementById('settings').onclick=()=>{api()?.hide_menu();api()?.open_settings();};document.addEventListener('keydown',e=>{if(e.key==='Escape')api()?.hide_menu();});})();</script></body></html>
