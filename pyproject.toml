[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novamind"
version = "3.0.0"
description = "Transparent AI Agent Framework with built-in observability and zero-trust execution"
readme = "README.md"
license = {text = "MIT"}
# 3.14 暂不支持：langchain-openai 在 3.14 导入期 SSL 初始化崩溃（待上游修复后复核放开上限）
requires-python = ">=3.12,<3.14"
authors = [
    {name = "NovaMind Contributors"}
]
keywords = ["ai", "agent", "llm", "framework", "observability", "middleware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.9.0",
    "questionary>=2.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "python-dotenv>=1.0.0",
    "jieba>=0.42.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pywebview>=5.0",
    "langchain-core>=0.2.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pre-commit>=3",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]
ollama = [
    "langchain-community>=0.2.0",
]

[project.scripts]
novamind = "entry.cli:main"

[tool.setuptools.packages.find]
include = ["novamind*", "entry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 初期保持最小规则集，后续只增不减
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
# 渐进接入：首批只查相对独立模块，被跟随的依赖不报错（错误只算在目标文件头上）
follow_imports = "silent"

[tool.ruff.lint.per-file-ignores]
# __init__.py 是公共 API 出口，re-export（含 import *）属预期用法
"**/__init__.py" = ["F401", "F403"]
