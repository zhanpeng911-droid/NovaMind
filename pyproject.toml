[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novamind"
version = "2.0.0"
description = "Transparent AI Agent Framework with built-in observability and zero-trust execution"
readme = "README.md"
license = {text = "MIT"}
# 3.14 暂不支持：langchain-openai 在 3.14 导入期 SSL 初始化崩溃（待上游修复后复核放开上限）
requires-python = ">=3.12,<3.14"
authors = [
    {name = "NovaMind Contributors"}
]
keywords = ["ai", "agent", "llm", "framework", "observability", "middleware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.9.0",
    "questionary>=2.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "python-dotenv>=1.0.0",
    "jieba>=0.42.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pywebview>=5.0",
    "langchain-core>=0.2.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]
ollama = [
    "langchain-community>=0.2.0",
]

[project.scripts]
novamind = "entry.cli:main"

[tool.setuptools.packages.find]
include = ["novamind*", "entry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
